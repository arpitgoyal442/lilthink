[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # These three are public values (your site URL and sender address), not secrets.
  # RESEND_API_KEY and N8N_WEBHOOK_SECRET are deliberately NOT listed, so they stay protected by the scan.
  SECRETS_SCAN_OMIT_KEYS = "ALLOWED_ORIGINS,FROM_EMAIL,REPLY_TO"

# app.js is requested with a version in its address, so browsers can keep it for a long time.
[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
